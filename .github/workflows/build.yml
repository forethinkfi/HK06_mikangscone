# Windows 설치·실행 파일(.exe)과 macOS 설치 파일(.dmg)을 GitHub에서 자동으로 만든다.
# Actions 탭에서 수동 실행하거나, v* 태그 또는 main의 앱 코드가 올라오면 실행된다.
name: Build desktop app
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['main', 'claude/quirky-mayer-sc9las']
    paths: ['src/**', 'electron/**', 'pet/**', 'build/**', 'package.json', 'package-lock.json', '.github/workflows/build.yml']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build desktop packages
        run: npm run dist -- --publish never
        env:
          # 인증서 없이 빌드: Windows는 서명 안 함, macOS는 package.json의 identity "-" 로 임시(ad-hoc) 서명
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ runner.os == 'Windows' && 'false' || 'true' }}
      - name: Check Windows standalone startup and pet files after reopening
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:MIKKANG_USER_DATA = Join-Path $env:RUNNER_TEMP 'mikang-portable-smoke'
          New-Item -ItemType Directory -Path $env:MIKKANG_USER_DATA | Out-Null
          $state = Join-Path $env:MIKKANG_USER_DATA 'data.json'
          '{"notes":[],"settings":{"launchAtLogin":false}}' | Set-Content -LiteralPath $state
          $exe = (Resolve-Path -LiteralPath 'dist/PeeKit-Windows.exe').Path
          $env:Path = "$env:SystemRoot\System32;$env:SystemRoot\System32\WindowsPowerShell\v1.0;$env:SystemRoot"
          $launcher = Start-Process -FilePath $exe -WorkingDirectory $env:RUNNER_TEMP -WindowStyle Hidden -PassThru
          $repeat = $null
          try {
            $started = $false
            for ($attempt = 0; $attempt -lt 45; $attempt++) {
              if ($launcher.HasExited) { throw "Standalone app exited with code $($launcher.ExitCode)" }
              $saved = Get-Content -Raw -LiteralPath $state -ErrorAction SilentlyContinue | ConvertFrom-Json
              if ($saved.settings.character -eq 'basic-memoring' -and $saved.settings.themePack -eq 'basic') { $started = $true; break }
              Start-Sleep -Seconds 1
            }
            if (!$started) { throw 'Standalone app did not finish starting' }
            $app = Get-CimInstance Win32_Process -Filter "ParentProcessId=$($launcher.Id)" |
              Where-Object { $_.Name -eq 'PeeKit.exe' } | Select-Object -First 1
            if (!$app.ExecutablePath) { throw 'Cannot locate the running app' }
            $pets = Join-Path (Split-Path -Parent $app.ExecutablePath) 'resources/assets/species'
            $repeat = Start-Process -FilePath $exe -WorkingDirectory $env:RUNNER_TEMP -WindowStyle Hidden -PassThru
            if (!$repeat.WaitForExit(45000)) { throw 'Second launch did not return to the running app' }
            if ($launcher.HasExited) { throw 'Second launch closed the running app' }
            foreach ($id in @('basic-memoring', 'mono-cat', 'pastel-octopus', 'vintage-teddy', 'block-dino')) {
              $folder = Join-Path $pets $id
              $species = Get-Content -Raw -LiteralPath (Join-Path $folder 'species.json') | ConvertFrom-Json
              if ($species.id -ne $id -or !(Test-Path -LiteralPath (Join-Path $folder $species.animations.idle.sheet))) {
                throw "A second launch removed a pet: $id"
              }
            }
          } finally {
            if ($repeat -and !$repeat.HasExited) { Stop-Process -Id $repeat.Id }
            Get-CimInstance Win32_Process -Filter "ParentProcessId=$($launcher.Id)" |
              ForEach-Object { Stop-Process -Id $_.ProcessId -ErrorAction SilentlyContinue }
            if (!$launcher.HasExited) { Stop-Process -Id $launcher.Id }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: PeeKit-jhj-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error

  sync-root-downloads:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: main-desktop-downloads
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: PeeKit-jhj-*
          path: ${{ runner.temp }}/desktop-artifacts
      - name: Commit and push verified desktop files
        shell: bash
        run: |
          source_paths=(.github/workflows/build.yml build electron package.json package-lock.json pet src)
          if ! git diff --quiet "$GITHUB_SHA" HEAD -- "${source_paths[@]}"; then
            echo "A newer app revision is already on main."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git lfs install --local
          artifacts="$RUNNER_TEMP/desktop-artifacts"
          arm64=("$artifacts"/PeeKit-jhj-macOS/*-mac-arm64.dmg)
          intel=("$artifacts"/PeeKit-jhj-macOS/*-mac-x64.dmg)
          test "${#arm64[@]}" -eq 1 && test -s "${arm64[0]}"
          test "${#intel[@]}" -eq 1 && test -s "${intel[0]}"
          cp "$artifacts/PeeKit-jhj-Windows/PeeKit-Windows.exe" MikangMemo-Windows.exe
          cp "${arm64[0]}" MikangMemo-macOS-AppleSilicon.dmg
          cp "${intel[0]}" MikangMemo-macOS-Intel.dmg
          git add -- MikangMemo-Windows.exe MikangMemo-macOS-AppleSilicon.dmg MikangMemo-macOS-Intel.dmg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Sync desktop downloads for ${GITHUB_SHA:0:7}"

          for attempt in 1 2 3; do
            git fetch origin main
            if ! git diff --quiet "$GITHUB_SHA" origin/main -- "${source_paths[@]}"; then
              echo "A newer app revision is already on main."
              exit 0
            fi
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: PeeKit-jhj-*
          path: packages
          merge-multiple: true
      - name: Publish verified installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          title="PeeKit $GITHUB_REF_NAME"
          if [[ "$GITHUB_REF_NAME" == "v0.2.3_notion" ]]; then
            title="PeeKit 0.2.3_notion"
            version="0.2.3"
          fi
          cd packages
          assets=("PeeKit-jhj-$version-windows-setup.exe" "PeeKit-Windows.exe"
                  "PeeKit-jhj-$version-mac-arm64.dmg" "PeeKit-jhj-$version-mac-x64.dmg")
          for file in "${assets[@]}"; do test -s "$file"; done
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$title" --generate-notes
