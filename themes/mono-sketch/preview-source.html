<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="theme.css">
<style>
  html, body { margin: 0; width: 240px; height: 160px; overflow: hidden; }
  body { position: relative; }
  .paper { position: absolute; left: 10px; top: 6px; width: 118px; height: 150px; }
  .lines { position: absolute; left: 24px; top: 46px; width: 88px; font: 600 9px/14px var(--font-ui); }
  .lines b { font: 700 11px/14px var(--font-title); display: block; margin-bottom: 3px; }
  .lines i { display: block; height: 1.5px; background: var(--rule); margin: 6px 0; font-style: normal; }
  .lines mark { font-size: 9px; }
  .cat { position: absolute; right: 30px; bottom: 6px; width: 88px; height: 88px; background: url('pet/idle.png') 0 0 / auto 88px no-repeat; }
  .bubble { position: absolute; right: 26px; top: 12px; padding: 5px 8px; font: 600 9px/1.3 var(--font-ui); border-width: 1.5px; }
  .bubble::after { width: 9px; height: 9px; bottom: -6px; left: 14px; border-width: 1.5px; }
  .tab { position: absolute; right: 0; top: 36px; font-size: 9px; padding: 8px 5px; border-width: 1.5px; }
  .tab::before { width: 14px; height: 7px; left: 3px; top: -4px; }
  .tab2 { top: 92px; --tab-bg: #1c1c1c; --tab-ink: #fff; }
  .tab2::before { display: none; }
</style>
<body class="theme-mono-sketch">
  <img class="paper" src="papers/binder-clip.svg" alt="">
  <div class="lines"><b>오늘 할 일</b><mark>3시 회의자료</mark><i></i><i></i><i></i></div>
  <div class="ms-bubble bubble">냐, 3시야!</div>
  <div class="cat"></div>
  <div class="ms-tab tab">업무</div>
  <div class="ms-tab tab tab2">생활</div>
</body>
